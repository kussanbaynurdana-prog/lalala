<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy birthday, Salta!</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#b98a52;--ink:#fff3dc;--red:#8a0f1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a1a14}}
:root[data-theme="dark"]{--bg:#3a1a14}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Caveat','Segoe Script',cursive}
body{display:grid;place-items:center}
#stage{position:relative;container-type:inline-size;width:min(100vw,calc(100dvh*.707));aspect-ratio:1414/2000;overflow:hidden;background:#7a1a1f;box-shadow:0 0 40px #0006}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.page.on{opacity:1;pointer-events:auto}
.page>img,.lay{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.btn{position:absolute;left:50%;transform:translateX(-50%);border:0;background:var(--red);color:var(--ink);font:700 5.4cqw 'Caveat','Segoe Script',cursive;padding:1.2cqw 6cqw 1.6cqw;border-radius:99cqw;box-shadow:0 1cqw 0 #4d0810;cursor:pointer;white-space:nowrap;transition:transform .15s}
.btn:active{transform:translateX(-50%) translateY(.6cqw)}
.btn:focus-visible,.back:focus-visible,#env:focus-visible{outline:.8cqw solid #fff;outline-offset:.6cqw}
.back{position:absolute;top:2.5cqw;left:2.5cqw;width:9cqw;height:9cqw;border-radius:50%;border:0;background:var(--red);color:var(--ink);font:700 7cqw/1 Caveat,cursive;cursor:pointer;padding-bottom:1cqw;z-index:5}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
/* envelope + letter */
#env{position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer;transition:transform .8s cubic-bezier(.6,0,.3,1),opacity .6s;z-index:2}
#env img{width:100%;height:100%;display:block}
#p2.open #env{transform:translateY(60%) rotate(4deg);opacity:0;pointer-events:none}
#letter{position:absolute;inset:0;opacity:0;transform:translateY(8%) scale(.86) rotate(-3deg);transition:all .9s .35s cubic-bezier(.2,.9,.3,1)}
#p2.open #letter{opacity:1;transform:none}
#letter img{width:100%;height:100%;display:block}
#p2 .btn{opacity:0;transition:opacity .5s}
#p2 #hint{opacity:1;bottom:5cqw;transition:opacity .4s}
#p2.open #hint{opacity:0;pointer-events:none}
#p2.open #toCake{opacity:1;transition-delay:1.2s;bottom:5cqw}
/* cake */
.fl{position:absolute;width:0;height:0;cursor:pointer}
.fl::before{content:"";position:absolute;left:-6cqw;top:-12cqw;width:12cqw;height:14cqw}
.f{position:absolute;left:-2.4cqw;top:-8.2cqw;width:4.8cqw;height:8.2cqw;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 72%,#fffbe0 8%,#ffd25c 42%,#ff8a1f 85%);box-shadow:0 0 4cqw 1cqw #ffb54780;transform-origin:50% 100%;transform:rotate(var(--lean,0deg)) scaleY(var(--s,1));animation:flick .17s ease-in-out infinite alternate;transition:opacity .35s,scale .35s}
@keyframes flick{from{translate:-.2cqw 0;filter:brightness(1)}to{translate:.25cqw -.2cqw;filter:brightness(1.12)}}
.fl.out .f{opacity:0;scale:.2;animation:none}
.smoke{position:absolute;left:-1cqw;top:-6cqw;width:2cqw;height:2cqw;border-radius:50%;background:#fff9;filter:blur(.6cqw);opacity:0}
.fl.out .smoke{animation:smoke 1.8s ease-out}
@keyframes smoke{0%{opacity:.85;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(1.5cqw,-16cqw) scale(3.2)}}
#pill{position:absolute;left:50%;bottom:3cqw;transform:translateX(-50%);background:var(--red);color:var(--ink);font:700 5cqw 'Caveat',cursive;padding:1cqw 5cqw 1.4cqw;border-radius:99cqw;box-shadow:0 1cqw 0 #4d0810;text-align:center;white-space:nowrap;z-index:4;transition:all .4s}
#pill.win{font-size:8cqw;bottom:6cqw;background:#fff3dc;color:var(--red)}
#relight{display:none;bottom:19cqw;font-size:4.6cqw;background:#fff3dc;color:var(--red);z-index:4}
#conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
@media (prefers-reduced-motion:reduce){.f,.pulse{animation:none}#letter,#env{transition-duration:.01s}}
</style></head>

    <div id="flames"></div>
    <div id="pill">blow into your mic</div>
    <button class="btn" id="relight">light them again</button>
    <canvas id="conf"></canvas>
  </section>
</main>
<script>
const $=s=>document.querySelector(s), pages=[0,$('#p1'),$('#p2'),$('#p3')];
const W=[[30.4,59.0],[42.6,66.25],[54.5,60.9],[64.0,65.25],[72.6,56.1]];
const flames=W.map(([x,y])=>{const d=document.createElement('div');d.className='fl';d.style.cssText=`left:${x}%;top:${y}%`;d.innerHTML='<i class="smoke"></i><i class="f"></i>';d.setAttribute('role','button');d.setAttribute('aria-label','Blow out this candle');d.tabIndex=0;$('#flames').append(d);d.onclick=()=>snuff(d);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')snuff(d)};return d});
let cur=1,mic=null,alive=5,breath=0,base=.02,calib=0,raf=0,won=false;
function go(n){pages[cur].classList.remove('on');cur=n;pages[n].classList.add('on');if(n===3)startMic();else stopMic()}
$('#open').onclick=()=>go(2);
$('#env').onclick=()=>$('#p2').classList.add('open');
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
function setPill(t,win){const p=$('#pill');p.textContent=t;p.classList.toggle('win',!!win)}
function snuff(d){if(d.classList.contains('out'))return;d.classList.add('out');alive--;if(!alive)celebrate()}
function relight(){won=false;alive=5;flames.forEach(f=>{f.classList.remove('out');f.querySelector('.smoke').style.animation='none'});setTimeout(()=>flames.forEach(f=>f.querySelector('.smoke').style.animation=''),50);$('#relight').style.display='none';setPill(mic?'blow into your mic':'tap a candle to blow it out');breath=0}
$('#relight').onclick=relight;
async function startMic(){
  if(mic||won)return;
  setPill(alive?'blow into your mic':'happy birthday, Salta!',!alive);
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaStreamSource(s),an=ac.createAnalyser();
    an.fftSize=1024;src.connect(an);mic={s,ac,an,buf:new Float32Array(1024),t:performance.now()};calib=0;base=.02;loop();
  }catch(e){setPill('mic is off, tap a candle to blow it out')}
}
function stopMic(){if(!mic)return;cancelAnimationFrame(raf);mic.s.getTracks().forEach(t=>t.stop());mic.ac.close();mic=null}
function loop(){
  if(!mic)return;raf=requestAnimationFrame(loop);
  const now=performance.now(),dt=(now-mic.t)/1000;mic.t=now;
  mic.an.getFloatTimeDomainData(mic.buf);
  let sum=0;for(const v of mic.buf)sum+=v*v;const rms=Math.sqrt(sum/mic.buf.length);
  if(calib<30){base=Math.max(base,rms);calib++}
  const lvl=Math.max(0,Math.min(1,(rms-base*1.5)/.25));
  breath=lvl>.12?Math.min(1,breath+dt*(.6+lvl)):Math.max(0,breath-dt*2);
  flames.forEach((f,i)=>{if(f.classList.contains('out'))return;const el=f.querySelector('.f');
    el.style.setProperty('--lean',(lvl*38*(i%2?-1:1)*.6+lvl*24)+'deg');el.style.setProperty('--s',1-lvl*.35)});
  if(breath>.45&&alive){const k=flames.filter(f=>!f.classList.contains('out'));k.forEach((f,i)=>setTimeout(()=>snuff(f),i*140));breath=0}
}
function celebrate(){won=true;setPill('happy birthday, Salta!',true);$('#relight').style.display='block';confetti()}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#conf'),x=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;
  const cols=['#e63b7a','#ffd23f','#3a7bd5','#7bc96f','#ff7a45','#fff3dc','#8a0f1c'];
  const P=Array.from({length:140},()=>({x:w/2+(Math.random()-.5)*w*.3,y:h*.62,vx:(Math.random()-.5)*16*devicePixelRatio,vy:-(8+Math.random()*16)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,s:(6+Math.random()*8)*devicePixelRatio,c:cols[Math.random()*7|0]}));
  let n=0;(function f(){x.clearRect(0,0,w,h);P.forEach(p=>{p.vy+=.35*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++n<220)requestAnimationFrame(f);else x.clearRect(0,0,w,h)})();
}
</script>
